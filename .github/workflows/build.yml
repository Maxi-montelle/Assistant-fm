name: Construire AssistantFM.exe

# À chaque envoi sur « main » : tests + construction de l'exe.
# Si le numéro de version (version.py) n'a pas encore été publié, une nouvelle version est créée
# et les applications installées la proposent au prochain démarrage.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire le numéro de version
        id: ver
        shell: bash
        run: |
          V=$(python -c "import version; print(version.VERSION)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Installer Tesseract
        run: choco install tesseract -y --no-progress

      - name: Copier Tesseract dans le projet (sans ses langues, on fournit le français)
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force -Path build_tess | Out-Null
          Get-ChildItem $src -File | Copy-Item -Destination build_tess
          Get-ChildItem build_tess | Measure-Object | Select-Object -ExpandProperty Count

      - name: Tests (lecture des captures + chances DoFocus)
        run: python tests/check.py

      - name: Construire l'exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name AssistantFM
          --add-data "tessdata;tessdata"
          --add-data "build_tess;tesseract"
          fm_live.py

      - name: Vérifier l'exe (lecture d'une capture)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AssistantFM.exe -ArgumentList "--selftest","tests\fenetre.png" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest de l'exe en échec ($($p.ExitCode))" }

      - name: Vérifier que l'exe trouve les mises à jour
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AssistantFM.exe -ArgumentList "--checkupdate" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "l'exe ne trouve pas les mises à jour ($($p.ExitCode))" }

      - name: Vérifier la mise à jour depuis l'appli (dossier avec accents et espaces)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "Clément FM test"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item dist\AssistantFM.exe (Join-Path $d "AssistantFM.exe")
          Copy-Item dist\AssistantFM.exe (Join-Path $env:RUNNER_TEMP "nouvelle.exe")
          $marker = Join-Path $env:RUNNER_TEMP "maj_ok.txt"
          $p = Start-Process -FilePath (Join-Path $d "AssistantFM.exe") -ArgumentList "--updatetest",('"' + (Join-Path $env:RUNNER_TEMP "nouvelle.exe") + '"'),('"' + $marker + '"') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installation de la mise à jour en échec ($($p.ExitCode))" }
          for ($i = 0; $i -lt 60 -and -not (Test-Path $marker); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $marker)) { throw "la nouvelle version ne s'est pas relancée" }
          Get-Content $marker
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $d "AssistantFM.exe.old")) { throw "l'ancien exe n'a pas été supprimé" }

      - uses: actions/upload-artifact@v4
        with:
          name: AssistantFM
          path: dist/AssistantFM.exe

      - name: Publier la version
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Assistant FM ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/AssistantFM.exe
          body_path: NOTES.md
